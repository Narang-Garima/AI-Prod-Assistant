astra_db:
  collection_name: "ecommercedata"

embedding_model:
  provider: "google"
  model_name: "gemini-embedding-001"

retriever:
  top_k: 5
  fetch_k: 50
  lambda_mult: 0.7
  use_compression: false

llm:
  groq:
    provider: "groq"
    #model_name: "deepseek-r1-distill-llama-70b"
    model_name: "llama-3.3-70b-versatile"
    temperature: 0
    max_output_tokens: 2048

  google:
    provider: "google"
    model_name: "gemini-3.5-flash-lite"
    temperature: 0
    max_output_tokens: 2048

  openai:
     provider: "openai"
     model_name: "gpt-4o"
     temperature: 0


agentic_rag:
  max_rewrites: 2
  recursion_limit: 25
  fallback_enabled: true
  routing_keywords:
    - review
    - rating
    - compare
    - recommend
    - best
    - vs
    - price
    - product
