[project]
name = "ai-prod-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Garima Narang" }]
dependencies = [
    "fastapi>=0.129.0",
    "playwright>=1.35.0",
    "langchain-astradb==0.6.1", # this will pull compatible astrapy>=2.0.1 automatically
    "astrapy>=2.0.1,<3.0.0",
    "langchain-google-genai",
    "langchain-openai",
    "langchain-groq",
    "selenium_stealth",
    "langgraph>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "AI-Prod-Assistant",
]

