[project]
name = "ai-prod-assistant"
version = "0.1.0"
description = "Applied GenAI product assistant with review acquisition, vector retrieval, LangGraph orchestration, and MCP tools."
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Garima Narang" }]
dependencies = [
    "astrapy==2.2.0",
    "beautifulsoup4==4.15.0",
    "ddgs==9.6.0",
    "fastapi==0.135.1",
    "grpcio==1.72.1",
    "jinja2==3.1.6",
    "langchain==0.3.27",
    "langchain-astradb==0.6.1",
    "langchain-core==0.3.86",
    "langchain-google-genai==2.1.8",
    "langchain-groq==0.3.6",
    "langchain-mcp-adapters==0.1.10",
    "langchain-openai==0.3.32",
    "langgraph==1.0.1",
    "mcp==1.14.0",
    "pandas==2.2.3",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.20",
    "PyYAML==6.0.3",
    "ragas==0.3.4",
    "selenium==4.35.0",
    "streamlit==1.49.1",
    "structlog==25.4.0",
    "undetected-chromedriver==3.5.5",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
