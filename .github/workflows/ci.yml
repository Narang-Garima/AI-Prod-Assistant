name: Run Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax smoke check
        run: |
          python -m py_compile scrape_buddy.py
          python -m py_compile scrape_buddy_powerbi.py
          python -m py_compile src/prod_assistant/router/main.py
          python -m py_compile src/prod_assistant/workflow/agentic_workflow_with_mcp_websearch.py

      - name: Run tests
        run: python -m pytest -q test
