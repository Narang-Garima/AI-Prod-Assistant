<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopBuddy Assistant v1</title>
    <style>
        :root {
            --bg: #f2f6fb;
            --panel: #ffffff;
            --sidebar: #0f172a;
            --text: #0f172a;
            --muted: #64748b;
            --border: #dbe3ee;
            --bot: #ffffff;
            --user: #e8f1ff;
            --accent: #0ea5a6;
            --accent-2: #0284c7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-columns: 310px 1fr;
            height: 100vh;
        }

        .sidebar {
            background: var(--sidebar);
            color: #fff;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-right: 1px solid #242424;
        }

        .brand {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #fff;
        }

        .brand small {
            display: block;
            margin-top: 4px;
            color: #a3a3a3;
            font-size: 12px;
            font-weight: 400;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .hero-card {
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: linear-gradient(160deg, rgba(14, 165, 166, 0.14), rgba(2, 132, 199, 0.12));
            border-radius: 12px;
            padding: 10px;
        }

        .hero-card img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        .new-chat {
            border: 1px solid #3a3a3a;
            background: linear-gradient(135deg, #0ea5a6, #0284c7);
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
        }

        .new-chat:hover { filter: brightness(1.06); }

        .history-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-title {
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .thread-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .thread-item {
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.35);
            border-radius: 10px;
            padding: 8px 9px;
            color: #e2e8f0;
            cursor: pointer;
            text-align: left;
        }

        .thread-item:hover {
            border-color: rgba(56, 189, 248, 0.45);
            background: rgba(2, 132, 199, 0.22);
        }

        .thread-item.active {
            border-color: rgba(14, 165, 166, 0.65);
            background: rgba(14, 165, 166, 0.2);
        }

        .thread-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            word-break: break-word;
        }

        .thread-meta {
            display: block;
            margin-top: 3px;
            font-size: 11px;
            color: #94a3b8;
        }

        .hint {
            color: #dbeafe;
            font-size: 18px;
            line-height: 1.5;
            font-weight: 600;
            margin-top: 6px;
        }

        .sidebar-footer {
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.5;
            border-top: 1px solid rgba(148, 163, 184, 0.25);
            padding-top: 10px;
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-logo {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .title {
            font-size: 16px;
            font-weight: 600;
        }

        .title small {
            margin-left: 8px;
            color: var(--muted);
            font-weight: 400;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 26px 0;
            min-height: 0;
        }

        .messages {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row.user { justify-content: flex-end; }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            flex: 0 0 auto;
            margin-top: 2px;
        }

        .avatar.bot {
            background: #0b3a5b;
            color: #fff;
        }

        .avatar.user {
            background: #0ea5a6;
            color: #fff;
        }

        .bubble {
            max-width: min(78ch, 80vw);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: var(--bot);
        }

        .row.user .bubble {
            background: var(--user);
            border-color: #c6dafc;
        }

        .meta {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            padding: 2px 8px;
        }

        .composer-wrap {
            border-top: 1px solid var(--border);
            background: var(--panel);
            padding: 14px 20px 18px;
        }

        .composer {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            background: #fff;
        }

        .composer textarea {
            flex: 1;
            border: none;
            resize: none;
            outline: none;
            font: inherit;
            min-height: 34px;
            max-height: 160px;
            line-height: 1.45;
        }

        .send {
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .send:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .bubble { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="/static/f6634145-b9d9-4ea1-b5e5-cb705192c6fd.png" alt="ShopBuddy">
                <div class="brand-text">
                    ShopBuddy Assistant
                    <small>QuickCart Help</small>
                </div>
            </div>
            <button id="newChatBtn" class="new-chat">+ New Chat</button>
            <div class="history-section">
                <div class="history-title">Recent Chats</div>
                <div id="threadList" class="thread-list">
                    <div class="thread-item"><span class="thread-label">No saved chats yet.</span></div>
                </div>
            </div>
            <div class="hero-card">
                <img src="/static/f6634145-b9d9-4ea1-b5e5-cb705192c6fd.png" alt="ShopBuddy Assistant">
            </div>
            <div class="hint">
                Ask product price, reviews, comparison, and recommendations.
            </div>
            <div class="sidebar-footer">
                &copy; 2026 Customer Support System<br>
                Need help? garimanarang2407@gmail.com
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="title-wrap">
                    <img class="title-logo" src="/static/f6634145-b9d9-4ea1-b5e5-cb705192c6fd.png" alt="ShopBuddy">
                    <div class="title">ShopBuddy <small id="status">Online</small></div>
                </div>
            </header>

            <section class="chat" id="chatScroll">
                <div class="messages" id="messages"></div>
            </section>

            <div class="composer-wrap">
                <form class="composer" id="composerForm">
                    <textarea id="prompt" name="msg" placeholder="Message ShopBuddy..." rows="1" required></textarea>
                    <button class="send" id="sendBtn" type="submit" title="Send">↑</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const messagesEl = document.getElementById("messages");
        const chatScrollEl = document.getElementById("chatScroll");
        const promptEl = document.getElementById("prompt");
        const formEl = document.getElementById("composerForm");
        const sendBtnEl = document.getElementById("sendBtn");
        const newChatBtnEl = document.getElementById("newChatBtn");
        const threadListEl = document.getElementById("threadList");

        let localThreadId = localStorage.getItem("shopbuddy_thread_id") || null;

        function nowTime() {
            const d = new Date();
            const h = d.getHours();
            const m = String(d.getMinutes()).padStart(2, "0");
            return `${h}:${m}`;
        }

        function parseMeta(text) {
            const raw = String(text || "");
            let normalized = raw
                .replace(/\\r\\n/g, "\n")
                .replace(/\\n/g, "\n")
                .replace(/\\"/g, "\"")
                .trim();

            // Remove wrapping quotes from stringified payloads
            if (
                (normalized.startsWith("\"") && normalized.endsWith("\"")) ||
                (normalized.startsWith("'") && normalized.endsWith("'"))
            ) {
                normalized = normalized.slice(1, -1).trim();
            }

            let source = "none";
            let route = "none";

            const sourceMatch = normalized.match(/\[MCP Tool Called:\s*([^\]]+)\]/i);
            const routeMatch = normalized.match(/\[Route:\s*([^\]]+)\]/i);
            if (sourceMatch) source = sourceMatch[1].trim();
            if (routeMatch) route = routeMatch[1].trim();

            const cleanText = normalized
                .replace(/\n?\[MCP Tool Called:[^\]]+\]/gi, "")
                .replace(/\n?\[Route:[^\]]+\]/gi, "")
                .replace(/\n{3,}/g, "\n\n")
                .trim();

            return { text: cleanText, source, route };
        }

        function addMessage(role, text) {
            const row = document.createElement("div");
            row.className = `row ${role}`;

            const avatar = document.createElement("div");
            avatar.className = `avatar ${role}`;
            avatar.textContent = role === "user" ? "You" : "AI";

            const bubbleWrap = document.createElement("div");
            const bubble = document.createElement("div");
            bubble.className = "bubble";

            if (role === "bot") {
                const parsed = parseMeta(text);
                bubble.textContent = parsed.text || text;

                const meta = document.createElement("div");
                meta.className = "meta";
                const t = document.createElement("span");
                t.className = "chip";
                t.textContent = nowTime();
                const s = document.createElement("span");
                s.className = "chip";
                s.textContent = `MCP Tool Called: ${parsed.source}`;
                const r = document.createElement("span");
                r.className = "chip";
                r.textContent = `Route: ${parsed.route}`;
                meta.append(t, s, r);
                bubbleWrap.appendChild(bubble);
                bubbleWrap.appendChild(meta);
            } else {
                bubble.textContent = text;
                const meta = document.createElement("div");
                meta.className = "meta";
                const t = document.createElement("span");
                t.className = "chip";
                t.textContent = nowTime();
                meta.appendChild(t);
                bubbleWrap.appendChild(bubble);
                bubbleWrap.appendChild(meta);
            }

            if (role === "user") {
                row.appendChild(bubbleWrap);
                row.appendChild(avatar);
            } else {
                row.appendChild(avatar);
                row.appendChild(bubbleWrap);
            }

            messagesEl.appendChild(row);
            chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
        }

        async function sendMessage(message) {
            sendBtnEl.disabled = true;
            try {
                const body = new URLSearchParams();
                body.append("msg", message);
                if (localThreadId) body.append("thread_id", localThreadId);

                const response = await fetch("/get", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: body.toString(),
                });
                const text = await response.text();
                addMessage("bot", text);
                loadThreads();
            } catch (err) {
                addMessage("bot", `Error: ${err}`);
            } finally {
                sendBtnEl.disabled = false;
            }
        }

        function renderThreads(threads) {
            threadListEl.innerHTML = "";
            if (!threads || !threads.length) {
                const empty = document.createElement("div");
                empty.className = "thread-item";
                empty.innerHTML = '<span class="thread-label">No saved chats yet.</span>';
                threadListEl.appendChild(empty);
                return;
            }

            for (const thread of threads) {
                const item = document.createElement("button");
                item.type = "button";
                item.className = "thread-item";
                if (thread.thread_id === localThreadId) item.classList.add("active");

                const shortId = String(thread.thread_id || "").replace(/^thread-/, "").slice(0, 10) || "thread";
                const turns = Number(thread.turns || 0);
                const when = thread.last_seen ? new Date(thread.last_seen).toLocaleString() : "unknown";

                item.innerHTML =
                    `<span class="thread-label">thread-${shortId}</span>` +
                    `<span class="thread-meta">${turns} turns · ${when}</span>`;

                item.addEventListener("click", async () => {
                    await loadThread(thread.thread_id);
                });
                threadListEl.appendChild(item);
            }
        }

        async function loadThreads() {
            try {
                const response = await fetch("/_history/threads");
                if (!response.ok) {
                    throw new Error("history endpoint unavailable");
                }
                const threads = await response.json();
                renderThreads(threads);
            } catch (error) {
                threadListEl.innerHTML = "";
                const note = document.createElement("div");
                note.className = "thread-item";
                note.innerHTML = '<span class="thread-label">History unavailable (start proxy on :8010).</span>';
                threadListEl.appendChild(note);
            }
        }

        async function loadThread(threadId) {
            try {
                const response = await fetch(`/_history/${encodeURIComponent(threadId)}`);
                if (!response.ok) {
                    throw new Error("thread not found");
                }
                const turns = await response.json();
                localThreadId = threadId;
                localStorage.setItem("shopbuddy_thread_id", localThreadId);
                messagesEl.innerHTML = "";

                for (const turn of turns) {
                    if (turn.user_message) addMessage("user", turn.user_message);
                    if (turn.assistant_message) addMessage("bot", turn.assistant_message);
                }
                chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
                loadThreads();
            } catch (error) {
                addMessage("bot", `Unable to load history for this thread: ${error.message}`);
            }
        }

        formEl.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = promptEl.value.trim();
            if (!message) return;
            addMessage("user", message);
            promptEl.value = "";
            promptEl.style.height = "24px";
            await sendMessage(message);
        });

        promptEl.addEventListener("input", () => {
            promptEl.style.height = "24px";
            promptEl.style.height = `${Math.min(promptEl.scrollHeight, 160)}px`;
        });

        promptEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                formEl.requestSubmit();
            }
        });

        newChatBtnEl.addEventListener("click", () => {
            localThreadId = `thread-${crypto.randomUUID().replace(/-/g, "")}`;
            localStorage.setItem("shopbuddy_thread_id", localThreadId);
            messagesEl.innerHTML = "";
            addMessage("bot", "Hello! How can I assist you today with your shopping queries?\n\n[MCP Tool Called: none]\n[Route: direct]");
            loadThreads();
        });

        if (!localThreadId) {
            localThreadId = `thread-${crypto.randomUUID().replace(/-/g, "")}`;
            localStorage.setItem("shopbuddy_thread_id", localThreadId);
        }

        addMessage("bot", "Hello! How can I assist you today with your shopping queries?\n\n[MCP Tool Called: none]\n[Route: direct]");
        loadThreads();
    </script>
</body>
</html>
