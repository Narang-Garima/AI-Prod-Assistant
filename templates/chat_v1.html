<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopBuddy Assistant</title>
    <style>
        :root {
            --bg: #f2f6fb;
            --panel: #ffffff;
            --sidebar: #0f172a;
            --text: #0f172a;
            --muted: #64748b;
            --border: #dbe3ee;
            --bot: #ffffff;
            --user: #e8f1ff;
            --accent: #0ea5a6;
            --accent-2: #0284c7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }
        .sidebar {
            background: var(--sidebar);
            color: #fff;
            padding: 14px;
            border-right: 1px solid #243042;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .brand {
            font-size: 18px;
            font-weight: 600;
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-logo-wrap {
            display: flex;
            justify-content: center;
            padding: 6px 0 2px;
        }
        .brand-logo {
            width: 92px;
            height: 92px;
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: #fff;
            box-shadow: 0 6px 18px rgba(2, 8, 23, 0.35);
        }
        .new-chat {
            border: 1px solid #3a3a3a;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
            font-weight: 600;
        }
        .thread-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 240px;
            overflow-y: auto;
        }
        .thread-item {
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(15, 23, 42, 0.35);
            border-radius: 10px;
            padding: 8px 9px;
            color: #e2e8f0;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .thread-item.active {
            border-color: rgba(14, 165, 166, 0.65);
            background: rgba(14, 165, 166, 0.2);
        }
        .thread-meta {
            margin-top: 4px;
            font-size: 11px;
            color: #94a3b8;
            display: block;
        }
        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .top-actions { display: flex; gap: 8px; }
        .dashboard-link {
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
        }
        .messages {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .row { display: flex; gap: 10px; }
        .row.user { justify-content: flex-end; }
        .bubble {
            max-width: min(78ch, 80vw);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: var(--bot);
        }
        .row.user .bubble {
            background: var(--user);
            border-color: #c6dafc;
        }
        .meta {
            margin-top: 6px;
            color: var(--muted);
            font-size: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chip {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            padding: 2px 8px;
        }
        .composer-wrap {
            border-top: 1px solid var(--border);
            background: var(--panel);
            padding: 14px 20px 18px;
        }
        .composer {
            max-width: 860px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            background: #fff;
        }
        .category-select {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
            font: inherit;
            color: var(--text);
            background: #fff;
            max-width: 220px;
        }
        .composer textarea {
            flex: 1;
            border: none;
            resize: none;
            outline: none;
            font: inherit;
            min-height: 34px;
            max-height: 160px;
            line-height: 1.45;
        }
        .send {
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        .send:disabled { background: #9ca3af; cursor: not-allowed; }
        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .bubble { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand-wrap">
                <div class="brand">ShopBuddy Assistant</div>
            </div>
            <button id="newChatBtn" class="new-chat">+ New Chat</button>
            <div class="sidebar-logo-wrap">
                <img class="brand-logo" src="/static/f6634145-b9d9-4ea1-b5e5-cb705192c6fd.png" alt="ShopBuddy Logo">
            </div>
            <div id="threadList" class="thread-list">
                <button class="thread-item">No saved chats yet.</button>
            </div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>ShopBuddy <small id="status">Online</small></div>
                <div class="top-actions">
                    <a id="dashboardLink" class="dashboard-link" href="/dashboard?category=all">Dashboard</a>
                </div>
            </header>
            <section class="chat" id="chatScroll">
                <div class="messages" id="messages"></div>
            </section>
            <div class="composer-wrap">
                <form class="composer" id="composerForm">
                    <select id="categoryHint" class="category-select" title="Category Filter">
                        <option value="auto">Auto</option>
                    </select>
                    <textarea id="prompt" name="msg" placeholder="Message ShopBuddy..." rows="1" required></textarea>
                    <button class="send" id="sendBtn" type="submit" title="Send">&#8593;</button>
                </form>
            </div>
        </main>
    </div>
    <script>
        const messagesEl = document.getElementById("messages");
        const chatScrollEl = document.getElementById("chatScroll");
        const promptEl = document.getElementById("prompt");
        const formEl = document.getElementById("composerForm");
        const sendBtnEl = document.getElementById("sendBtn");
        const categoryHintEl = document.getElementById("categoryHint");
        const dashboardLinkEl = document.getElementById("dashboardLink");
        const newChatBtnEl = document.getElementById("newChatBtn");
        const threadListEl = document.getElementById("threadList");
        let localThreadId = localStorage.getItem("shopbuddy_thread_id") || null;

        function nowTime() {
            const d = new Date();
            return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
        }

        function makeThreadId() {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return `thread-${window.crypto.randomUUID().replace(/-/g, "")}`;
            }
            const fallback = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`;
            return `thread-${fallback.replace(/[^a-z0-9]/gi, "")}`;
        }

        function parseMeta(text) {
            const raw = String(text || "");
            const sourceMatch = raw.match(/\[MCP Tool Called:\s*([^\]]+)\]/i);
            const routeMatch = raw.match(/\[Route:\s*([^\]]+)\]/i);
            const source = sourceMatch ? sourceMatch[1].trim() : "none";
            const route = routeMatch ? routeMatch[1].trim() : "none";
            let clean = raw
                .replace(/\n?\[MCP Tool Called:[^\]]+\]/gi, "")
                .replace(/\n?\[Route:[^\]]+\]/gi, "")
                .replace(/\n{3,}/g, "\n\n")
                .trim();
            clean = clean
                .replace(/\\r\\n/g, "\n")
                .replace(/\\n/g, "\n")
                .replace(/\\"/g, "\"")
                .trim();
            if (
                (clean.startsWith("\"") && clean.endsWith("\"")) ||
                (clean.startsWith("'") && clean.endsWith("'"))
            ) {
                clean = clean.slice(1, -1).trim();
            }
            return { text: clean, source, route };
        }

        function addMessage(role, text) {
            const row = document.createElement("div");
            row.className = `row ${role}`;
            const bubbleWrap = document.createElement("div");
            const bubble = document.createElement("div");
            bubble.className = "bubble";

            if (role === "bot") {
                const parsed = parseMeta(text);
                bubble.textContent = parsed.text || text;
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.innerHTML = `<span class="chip">${nowTime()}</span><span class="chip">MCP Tool: ${parsed.source}</span><span class="chip">Route: ${parsed.route}</span>`;
                bubbleWrap.appendChild(bubble);
                bubbleWrap.appendChild(meta);
            } else {
                bubble.textContent = text;
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.innerHTML = `<span class="chip">${nowTime()}</span>`;
                bubbleWrap.appendChild(bubble);
                bubbleWrap.appendChild(meta);
            }

            row.appendChild(bubbleWrap);
            messagesEl.appendChild(row);
            chatScrollEl.scrollTop = chatScrollEl.scrollHeight;
        }

        async function loadCategories() {
            try {
                const response = await fetch("/_categories");
                if (!response.ok) return;
                const payload = await response.json();
                const categories = Array.isArray(payload.categories) ? payload.categories : [];
                categoryHintEl.innerHTML = '<option value="auto">Auto</option>';
                for (const c of categories) {
                    const option = document.createElement("option");
                    option.value = c.value;
                    option.textContent = `${c.label} (${c.count})`;
                    categoryHintEl.appendChild(option);
                }
            } catch (_) {}
            updateDashboardLink();
        }

        function updateDashboardLink() {
            const selected = (categoryHintEl.value || "auto").trim().toLowerCase();
            const category = selected === "auto" ? "all" : selected;
            dashboardLinkEl.href = `/dashboard?category=${encodeURIComponent(category)}`;
        }

        async function sendMessage(message) {
            sendBtnEl.disabled = true;
            try {
                const body = new URLSearchParams();
                body.append("msg", message);
                body.append("category_hint", categoryHintEl.value || "auto");
                if (localThreadId) body.append("thread_id", localThreadId);
                const response = await fetch("/get", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: body.toString(),
                });
                const text = await response.text();
                addMessage("bot", text);
                loadThreads();
            } catch (err) {
                addMessage("bot", `Error: ${err}`);
            } finally {
                sendBtnEl.disabled = false;
            }
        }

        function renderThreads(threads) {
            threadListEl.innerHTML = "";
            if (!threads || !threads.length) {
                const empty = document.createElement("button");
                empty.className = "thread-item";
                empty.textContent = "No saved chats yet.";
                threadListEl.appendChild(empty);
                return;
            }
            for (const thread of threads) {
                const item = document.createElement("button");
                item.type = "button";
                item.className = "thread-item";
                if (thread.thread_id === localThreadId) item.classList.add("active");
                const shortId = String(thread.thread_id || "").replace(/^thread-/, "").slice(0, 10) || "thread";
                const turns = Number(thread.turns || 0);
                const when = thread.last_seen ? new Date(thread.last_seen).toLocaleString() : "unknown";
                item.innerHTML = `<span>thread-${shortId}</span><span class="thread-meta">${turns} turns - ${when}</span>`;
                item.addEventListener("click", async () => {
                    await loadThread(thread.thread_id);
                });
                threadListEl.appendChild(item);
            }
        }

        async function loadThreads() {
            try {
                const response = await fetch("/_history/threads");
                if (!response.ok) throw new Error("history endpoint unavailable");
                const threads = await response.json();
                renderThreads(threads);
            } catch (_) {
                threadListEl.innerHTML = '<button class="thread-item">History unavailable.</button>';
            }
        }

        async function loadThread(threadId) {
            try {
                const response = await fetch(`/_history/${encodeURIComponent(threadId)}`);
                if (!response.ok) throw new Error("thread not found");
                const turns = await response.json();
                localThreadId = threadId;
                localStorage.setItem("shopbuddy_thread_id", localThreadId);
                messagesEl.innerHTML = "";
                for (const turn of turns) {
                    if (turn.user_message) addMessage("user", turn.user_message);
                    if (turn.assistant_message) addMessage("bot", turn.assistant_message);
                }
                loadThreads();
            } catch (error) {
                addMessage("bot", `Unable to load history: ${error.message}`);
            }
        }

        formEl.addEventListener("submit", async (e) => {
            e.preventDefault();
            const message = promptEl.value.trim();
            if (!message) return;
            addMessage("user", message);
            promptEl.value = "";
            promptEl.style.height = "24px";
            await sendMessage(message);
        });

        categoryHintEl.addEventListener("change", () => {
            updateDashboardLink();
        });

        promptEl.addEventListener("input", () => {
            promptEl.style.height = "24px";
            promptEl.style.height = `${Math.min(promptEl.scrollHeight, 160)}px`;
        });

        promptEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                formEl.requestSubmit();
            }
        });

        newChatBtnEl.addEventListener("click", () => {
            localThreadId = makeThreadId();
            localStorage.setItem("shopbuddy_thread_id", localThreadId);
            messagesEl.innerHTML = "";
            addMessage("bot", "Hello! How can I assist you today with your shopping queries?\n\n[MCP Tool Called: none]\n[Route: direct]");
            loadThreads();
        });

        if (!localThreadId) {
            localThreadId = makeThreadId();
            localStorage.setItem("shopbuddy_thread_id", localThreadId);
        }

        addMessage("bot", "Hello! How can I assist you today with your shopping queries?\n\n[MCP Tool Called: none]\n[Route: direct]");
        loadCategories();
        updateDashboardLink();
        loadThreads();
    </script>
</body>
</html>
